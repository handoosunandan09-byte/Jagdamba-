services:
  - type: web
    name: jagdamba-backend
    runtime: python
    rootDir: backend
    # Paid plan: 0.5 CPU / 512 MB, US$7/month, never sleeps (approved by the owner).
    # This service is Blueprint-managed, so this line decides the plan.
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers --timeout-keep-alive 30
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: jagdamba
      - key: GEMINI_API_KEY
        sync: false
      # Real SOS text messages (leave blank to disable)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Automatic WhatsApp alerts (sandbox: +14155238886)
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_WHATSAPP_CONTENT_SID
        sync: false
      - key: DEFAULT_COUNTRY_CODE
        value: "+91"
      # Identify the app to OpenStreetMap services (put your email in it)
      - key: OSM_USER_AGENT
        sync: false
      # Admin console: Google sign-in client ID, and the Google email(s) allowed in
      - key: ADMIN_GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
