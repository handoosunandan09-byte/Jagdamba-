services:
  - type: web
    name: jagdamba-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: jagdamba
      - key: EMERGENT_LLM_KEY
        sync: false
