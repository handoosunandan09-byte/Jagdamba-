# Render's free plan puts the backend to sleep after 15 minutes without traffic,
# which makes the app take ~50 seconds to open. This pings it every 10 minutes.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Jagdamba API
        run: curl -fsS --max-time 90 https://jagdamba-backend-wz8e.onrender.com/api/ || true
